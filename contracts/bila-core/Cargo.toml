[package]
name = "bila-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "BILA core: restricted treasury and spending-policy enforcement for AI agents on NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
